name: GolulDeAur
options:
  bundleIdPrefix: ro.draghicioiu
  deploymentTarget:
    iOS: "16.0"
targets:
  GolulDeAur:
    type: application
    platform: iOS
    sources: [GolulDeAur]
    info:
      path: GolulDeAur/Info.plist
      properties:
        CFBundleDisplayName: Golul de Aur
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ro.draghicioiu.goluldeaur
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
