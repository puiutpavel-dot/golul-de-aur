name: Meciul zilei

on:
  schedule:
    # La 10 minute: GitHub sare peste multe rulari programate, asa ca incercam des (rularea e ieftina).
    - cron: "4,14,24,34,44,54 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Alege meciul si ia scorul
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Daca meciul zilei a inceput, rularea ramane pornita si cauta scorul pana apare
          # (cel mult 5 ore de la start), ca rezultatul sa nu depinda de urmatoarea rulare programata.
          for i in $(seq 1 16); do
            git pull -q --rebase origin main
            node scripts/sync.mjs
            git add data
            git diff --cached --quiet || (git commit -q -m "Actualizare meciul zilei" && git push -q)
            wait=$(node scripts/sync.mjs --wait)
            [ "$wait" -gt 0 ] || break
            echo "meci in desfasurare: astept $wait secunde pana la urmatoarea cautare a scorului"
            sleep "$wait"
          done
